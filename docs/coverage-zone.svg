  <!-- legend -->
  <g transform="translate(560,95)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#1b2a38">An aircraft is received if it flies at…</text>
    <rect x="0" y="16" width="26" height="16" fill="#1e88e5" fill-opacity="0.3" stroke="#1565c0" stroke-width="2"/><text x="38" y="29" font-size="14" fill="#1b2a38">high altitude (e.g. 10,000 ft)</text>
    <rect x="0" y="46" width="26" height="16" fill="#43a047" fill-opacity="0.35" stroke="#2e7d32" stroke-width="2"/><text x="38" y="59" font-size="14" fill="#1b2a38">medium altitude (e.g. 3,000 ft)</text>
    <rect x="0" y="76" width="26" height="16" fill="#fb8c00" fill-opacity="0.45" stroke="#e65100" stroke-width="2"/><text x="38" y="89" font-size="14" fill="#1b2a38">low altitude (e.g. 300 ft)</text>
  </g>
  <g transform="translate(560,235)" font-size="13.5" fill="#33414d">
    <text x="0" y="0" font-weight="bold" font-size="15" fill="#1b2a38">How to read this diagram</text>
    <text x="0" y="24">• Each coloured zone is where an aircraft</text><text x="8" y="42">at that altitude can be received.</text>
    <text x="0" y="66">• The higher the aircraft, the larger the zone.</text>
    <text x="0" y="90">• Behind a mountain the zone is hollowed out:</text><text x="8" y="108">the terrain blocks the direct view.</text>
    <text x="0" y="132">• At low altitude the “holes” are much larger.</text>
  </g>
  <text x="450.0" y="456" text-anchor="middle" font-size="12" fill="#6b7a66">Illustrative diagram, not real data. The tool writes these outlines as a KML file (Google Earth, QGIS).</text>
</svg>