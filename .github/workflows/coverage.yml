name: ADS-B / ADS-L coverage

on:
  workflow_dispatch:
    inputs:
      lat:
        description: "Latitude, WGS84 decimal degrees (e.g. 46.9480)"
        required: true
        type: string
      lon:
        description: "Longitude, WGS84 decimal degrees (e.g. 7.4470)"
        required: true
        type: string
      mode:
        description: "Levels: agl = height above ground (low altitudes), amsl = altitude above mean sea level"
        required: true
        type: choice
        default: agl
        options: [agl, amsl]
      ant_h:
        description: "Antenna height above ground (m)"
        required: true
        type: string
        default: "10"
      alt_ft:
        description: "Levels in ft, comma-separated (empty = mode default)"
        required: false
        type: string
        default: ""
      near_km:
        description: "swissALTI3D radius (km); 0 = disabled (outside Switzerland)"
        required: true
        type: string
        default: "10"
      near_res_m:
        description: "swissALTI3D resolution after decimation (m): 10, 20, 50..."
        required: true
        type: string
        default: "20"
      rmax_km:
        description: "Maximum range computed (km); empty = mode default (400 amsl, 150 agl)"
        required: false
        type: string
        default: ""
      k:
        description: "Effective Earth radius factor"
        required: true
        type: string
        default: "1.3333"

permissions:
  contents: read

concurrency:
  group: coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install ".[geotiff]"

      - name: Cache swissALTI3D tiles
        uses: actions/cache@v4
        with:
          path: ~/.cache/adsb_coverage
          key: swissalti3d-${{ inputs.near_res_m }}-${{ github.run_id }}
          restore-keys: swissalti3d-${{ inputs.near_res_m }}-

      - name: Validate the inputs
        env:
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
          ANT_H: ${{ inputs.ant_h }}
          ALT_FT: ${{ inputs.alt_ft }}
          NEAR_KM: ${{ inputs.near_km }}
          NEAR_RES_M: ${{ inputs.near_res_m }}
          RMAX_KM: ${{ inputs.rmax_km }}
          K: ${{ inputs.k }}
        run: |
          python - <<'PY'
          import os, re, sys
          num = re.compile(r"^-?\d+(\.\d+)?$")
          def need(name, lo, hi, optional=False):
              v = os.environ.get(name, "").strip()
              if not v and optional:
                  return
              if not num.match(v) or not (lo <= float(v) <= hi):
                  sys.exit(f"Invalid input: {name}={v!r} (expected a number between {lo} and {hi})")
          need("LAT", -90, 90); need("LON", -180, 180)
          need("ANT_H", 0, 500); need("NEAR_KM", 0, 60); need("NEAR_RES_M", 2, 100)
          need("RMAX_KM", 1, 500, optional=True); need("K", 1, 3)
          alt = os.environ.get("ALT_FT", "").strip()
          if alt and not re.match(r"^\d+(\.\d+)?(,\d+(\.\d+)?)*$", alt):
              sys.exit(f"Invalid input: ALT_FT={alt!r} (e.g. 30,100,300)")
          PY

      - name: Compute the coverage
        env:
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
          MODE: ${{ inputs.mode }}
          ANT_H: ${{ inputs.ant_h }}
          ALT_FT: ${{ inputs.alt_ft }}
          NEAR_KM: ${{ inputs.near_km }}
          NEAR_RES_M: ${{ inputs.near_res_m }}
          RMAX_KM: ${{ inputs.rmax_km }}
          K: ${{ inputs.k }}
        run: |
          set -euo pipefail
          mkdir -p out
          OUT="out/coverage_${LAT}_${LON}_${MODE}.kml"
          args=("$LAT" "$LON" --ant-h "$ANT_H" --near-km "$NEAR_KM" --near-res-m "$NEAR_RES_M" --k "$K" -o "$OUT")
          if [ "$MODE" = "agl" ]; then args+=(--agl); fi
          if [ -n "$ALT_FT" ]; then args+=(--alt-ft "$ALT_FT"); fi
          if [ -n "$RMAX_KM" ]; then args+=(--rmax-km "$RMAX_KM"); fi
          adsb-coverage "${args[@]}" 2>&1 | tee out/resume.txt
          {
            echo "## ADS-B / ADS-L coverage: ${LAT}, ${LON} (${MODE})"
            echo
            echo '```'
            cat out/resume.txt
            echo '```'
            echo
            echo "The KML file is in the **Artifacts** of this run (open it with Google Earth or QGIS)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the KML
        uses: actions/upload-artifact@v4
        with:
          name: couverture-kml
          path: out/*.kml
          retention-days: 30
