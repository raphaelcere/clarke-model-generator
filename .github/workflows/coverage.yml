name: ADS-B / ADS-L coverage

on:
  workflow_dispatch:
    inputs:
      lat:
        description: "Latitude, WGS84 decimal degrees (e.g. 46.9480)"
        required: true
        type: string
      lon:
        description: "Longitude, WGS84 decimal degrees (e.g. 7.4470)"
        required: true
        type: string
      mode:
        description: "Levels: agl = height above ground (low altitudes), amsl = altitude above mean sea level"
        required: true
        type: choice
        default: agl
        options: [agl, amsl]
      ant_h:
        description: "Antenna height above ground (m)"
        required: true
        type: string
        default: "10"
      alt_ft:
        description: "Levels in ft, comma-separated (empty = mode default)"
        required: false
        type: string
        default: ""
      near_km:
        description: "swissALTI3D radius (km); 0 = disabled (outside Switzerland)"
        required: true
        type: string
        default: "10"
      near_res_m:
        description: "swissALTI3D resolution after decimation (m): 10, 20, 50..."
        required: true
        type: string
        default: "20"
      rmax_km:
        description: "Maximum range computed (km); empty = mode default (400 amsl, 150 agl)"
        required: false
        type: string
        default: ""
      k:
        description: "Effective Earth radius factor"
        required: true
        type: string
        default: "1.3333"
      fading:
        description: "Fading: none = line of sight only; rayleigh = scattered field only (Clarke 1968); rice = direct wave plus scattered field"
        required: true
        type: choice
        default: none
        options: [none, rayleigh, rice]
      preset:
        description: "Test preset that fills the empty link budget fields below with the example values of the README (turns fading on as rice if it is none)"
        required: true
        type: choice
        default: none
        options: [none, adsb1090-example, adsl-m-example]
      freq_mhz:
        description: "Fading only: carrier frequency (MHz)"
        required: false
        type: string
        default: ""
      eirp_dbm:
        description: "Fading only: aircraft transmitter EIRP (dBm)"
        required: false
        type: string
        default: ""
      rx_gain_dbi:
        description: "Fading only: receiving antenna gain (dBi)"
        required: false
        type: string
        default: ""
      losses_db:
        description: "Fading only: cable and connector losses (dB)"
        required: false
        type: string
        default: "0"
      sensitivity_dbm:
        description: "Fading only: receiver sensitivity (dBm)"
        required: false
        type: string
        default: ""
      k_db:
        description: "Fading rice only: K-factor, direct over scattered power (dB)"
        required: false
        type: string
        default: ""
      prob:
        description: "Fading only: minimum reception probability of the drawn zone (0 to 1)"
        required: false
        type: string
        default: "0.9"

permissions:
  contents: read

concurrency:
  group: coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install ".[geotiff,fading]"

      - name: Cache swissALTI3D tiles
        uses: actions/cache@v4
        with:
          path: ~/.cache/adsb_coverage
          key: swissalti3d-${{ inputs.near_res_m }}-${{ github.run_id }}
          restore-keys: swissalti3d-${{ inputs.near_res_m }}-

      - name: Resolve the preset
        env:
          PRESET: ${{ inputs.preset }}
          IN_FADING: ${{ inputs.fading }}
          IN_FREQ_MHZ: ${{ inputs.freq_mhz }}
          IN_EIRP_DBM: ${{ inputs.eirp_dbm }}
          IN_RX_GAIN_DBI: ${{ inputs.rx_gain_dbi }}
          IN_LOSSES_DB: ${{ inputs.losses_db }}
          IN_SENSITIVITY_DBM: ${{ inputs.sensitivity_dbm }}
          IN_K_DB: ${{ inputs.k_db }}
          IN_PROB: ${{ inputs.prob }}
        run: |
          set -euo pipefail
          # Example values from the README (not validated defaults): freq MHz, EIRP dBm, Rx gain dBi, sensitivity dBm, K dB
          case "$PRESET" in
            none) P_FREQ=""; P_EIRP=""; P_GAIN=""; P_SENS=""; P_K="" ;;
            adsb1090-example) P_FREQ=1090; P_EIRP=51; P_GAIN=0; P_SENS=-84; P_K=10 ;;
            adsl-m-example) P_FREQ=868.2; P_EIRP=16.15; P_GAIN=0; P_SENS=-100; P_K=10 ;;
            *) echo "Unknown preset: $PRESET"; exit 1 ;;
          esac
          FADING="$IN_FADING"
          if [ "$PRESET" != "none" ] && [ "$FADING" = "none" ]; then FADING=rice; fi
          {
            echo "FADING=$FADING"
            echo "FREQ_MHZ=${IN_FREQ_MHZ:-$P_FREQ}"
            echo "EIRP_DBM=${IN_EIRP_DBM:-$P_EIRP}"
            echo "RX_GAIN_DBI=${IN_RX_GAIN_DBI:-$P_GAIN}"
            echo "LOSSES_DB=$IN_LOSSES_DB"
            echo "SENSITIVITY_DBM=${IN_SENSITIVITY_DBM:-$P_SENS}"
            echo "K_DB=${IN_K_DB:-$P_K}"
            echo "PROB=$IN_PROB"
          } >> "$GITHUB_ENV"

      - name: Validate the inputs
        env:
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
          ANT_H: ${{ inputs.ant_h }}
          ALT_FT: ${{ inputs.alt_ft }}
          NEAR_KM: ${{ inputs.near_km }}
          NEAR_RES_M: ${{ inputs.near_res_m }}
          RMAX_KM: ${{ inputs.rmax_km }}
          K: ${{ inputs.k }}
        run: |
          python - <<'PY'
          import os, re, sys
          num = re.compile(r"^-?\d+(\.\d+)?$")
          def need(name, lo, hi, optional=False):
              v = os.environ.get(name, "").strip()
              if not v and optional:
                  return
              if not num.match(v) or not (lo <= float(v) <= hi):
                  sys.exit(f"Invalid input: {name}={v!r} (expected a number between {lo} and {hi})")
          need("LAT", -90, 90); need("LON", -180, 180)
          need("ANT_H", 0, 500); need("NEAR_KM", 0, 60); need("NEAR_RES_M", 2, 100)
          need("RMAX_KM", 1, 500, optional=True); need("K", 1, 3)
          if os.environ["FADING"] != "none":
              need("FREQ_MHZ", 100, 6000); need("EIRP_DBM", -20, 100); need("RX_GAIN_DBI", -30, 50)
              need("LOSSES_DB", 0, 60); need("SENSITIVITY_DBM", -140, 0); need("PROB", 0.001, 0.999)
              if os.environ["FADING"] == "rice":
                  need("K_DB", -20, 40)
          alt = os.environ.get("ALT_FT", "").strip()
          if alt and not re.match(r"^\d+(\.\d+)?(,\d+(\.\d+)?)*$", alt):
              sys.exit(f"Invalid input: ALT_FT={alt!r} (e.g. 30,100,300)")
          PY

      - name: Compute the coverage
        env:
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
          MODE: ${{ inputs.mode }}
          ANT_H: ${{ inputs.ant_h }}
          ALT_FT: ${{ inputs.alt_ft }}
          NEAR_KM: ${{ inputs.near_km }}
          NEAR_RES_M: ${{ inputs.near_res_m }}
          RMAX_KM: ${{ inputs.rmax_km }}
          K: ${{ inputs.k }}
        run: |
          set -euo pipefail
          mkdir -p out
          OUT="out/coverage_${LAT}_${LON}_${MODE}_${FADING}.kml"
          args=("$LAT" "$LON" --ant-h "$ANT_H" --near-km "$NEAR_KM" --near-res-m "$NEAR_RES_M" --k "$K" -o "$OUT")
          if [ "$MODE" = "agl" ]; then args+=(--agl); fi
          if [ -n "$ALT_FT" ]; then args+=(--alt-ft "$ALT_FT"); fi
          if [ -n "$RMAX_KM" ]; then args+=(--rmax-km "$RMAX_KM"); fi
          if [ "$FADING" != "none" ]; then
            args+=(--fading "$FADING" --freq-mhz "$FREQ_MHZ" --eirp-dbm "$EIRP_DBM" --rx-gain-dbi "$RX_GAIN_DBI"
                   --losses-db "$LOSSES_DB" --sensitivity-dbm "$SENSITIVITY_DBM" --prob "$PROB")
            if [ "$FADING" = "rice" ]; then args+=(--k-db "$K_DB"); fi
          fi
          adsb-coverage "${args[@]}" 2>&1 | tee out/resume.txt
          {
            echo "## ADS-B / ADS-L coverage: ${LAT}, ${LON} (${MODE})"
            if [ "$FADING" != "none" ]; then
              echo
              KTXT=""; [ "$FADING" = "rice" ] && KTXT=", K ${K_DB} dB"
              echo "Fading: ${FADING}, ${FREQ_MHZ} MHz, EIRP ${EIRP_DBM} dBm, Rx gain ${RX_GAIN_DBI} dBi, losses ${LOSSES_DB} dB, sensitivity ${SENSITIVITY_DBM} dBm${KTXT}, P >= ${PROB}"
            fi
            echo
            echo '```'
            cat out/resume.txt
            echo '```'
            echo
            echo "The KML file is in the **Artifacts** of this run (open it with Google Earth or QGIS)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the KML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-kml
          path: out/*.kml
          retention-days: 30
