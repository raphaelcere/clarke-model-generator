name: Calcul de couverture ADS-B / ADS-L

on:
  workflow_dispatch:
    inputs:
      lat:
        description: "Latitude WGS84 (degrés décimaux, ex. 46.9480)"
        required: true
        type: string
      lon:
        description: "Longitude WGS84 (degrés décimaux, ex. 7.4470)"
        required: true
        type: string
      mode:
        description: "Niveaux : agl = hauteur au-dessus du sol (basses altitudes), amsl = altitude absolue"
        required: true
        type: choice
        default: agl
        options: [agl, amsl]
      ant_h:
        description: "Hauteur de l'antenne au-dessus du sol (m)"
        required: true
        type: string
        default: "10"
      alt_ft:
        description: "Niveaux en ft, séparés par des virgules (vide = défaut du mode)"
        required: false
        type: string
        default: ""
      near_km:
        description: "Rayon swissALTI3D (km) ; 0 = désactivé (hors Suisse)"
        required: true
        type: string
        default: "10"
      near_res_m:
        description: "Résolution de swissALTI3D après décimation (m) : 10, 20, 50…"
        required: true
        type: string
        default: "20"
      rmax_km:
        description: "Portée maximale calculée (km) ; vide = défaut du mode (400 amsl, 150 agl)"
        required: false
        type: string
        default: ""
      k:
        description: "Facteur de rayon terrestre effectif"
        required: true
        type: string
        default: "1.3333"

permissions:
  contents: read

concurrency:
  group: coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer
        run: pip install ".[geotiff]"

      - name: Cache des tuiles swissALTI3D
        uses: actions/cache@v4
        with:
          path: ~/.cache/adsb_coverage
          key: swissalti3d-${{ inputs.near_res_m }}-${{ github.run_id }}
          restore-keys: swissalti3d-${{ inputs.near_res_m }}-

      - name: Valider les entrées
        env:
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
          ANT_H: ${{ inputs.ant_h }}
          ALT_FT: ${{ inputs.alt_ft }}
          NEAR_KM: ${{ inputs.near_km }}
          NEAR_RES_M: ${{ inputs.near_res_m }}
          RMAX_KM: ${{ inputs.rmax_km }}
          K: ${{ inputs.k }}
        run: |
          python - <<'PY'
          import os, re, sys
          num = re.compile(r"^-?\d+(\.\d+)?$")
          def need(name, lo, hi, optional=False):
              v = os.environ.get(name, "").strip()
              if not v and optional:
                  return
              if not num.match(v) or not (lo <= float(v) <= hi):
                  sys.exit(f"Entrée invalide : {name}={v!r} (attendu : nombre entre {lo} et {hi})")
          need("LAT", -90, 90); need("LON", -180, 180)
          need("ANT_H", 0, 500); need("NEAR_KM", 0, 60); need("NEAR_RES_M", 2, 100)
          need("RMAX_KM", 1, 500, optional=True); need("K", 1, 3)
          alt = os.environ.get("ALT_FT", "").strip()
          if alt and not re.match(r"^\d+(\.\d+)?(,\d+(\.\d+)?)*$", alt):
              sys.exit(f"Entrée invalide : ALT_FT={alt!r} (ex. 30,100,300)")
          PY

      - name: Calculer la couverture
        env:
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
          MODE: ${{ inputs.mode }}
          ANT_H: ${{ inputs.ant_h }}
          ALT_FT: ${{ inputs.alt_ft }}
          NEAR_KM: ${{ inputs.near_km }}
          NEAR_RES_M: ${{ inputs.near_res_m }}
          RMAX_KM: ${{ inputs.rmax_km }}
          K: ${{ inputs.k }}
        run: |
          set -euo pipefail
          mkdir -p out
          OUT="out/coverage_${LAT}_${LON}_${MODE}.kml"
          args=("$LAT" "$LON" --ant-h "$ANT_H" --near-km "$NEAR_KM" --near-res-m "$NEAR_RES_M" --k "$K" -o "$OUT")
          if [ "$MODE" = "agl" ]; then args+=(--agl); fi
          if [ -n "$ALT_FT" ]; then args+=(--alt-ft "$ALT_FT"); fi
          if [ -n "$RMAX_KM" ]; then args+=(--rmax-km "$RMAX_KM"); fi
          adsb-coverage "${args[@]}" 2>&1 | tee out/resume.txt
          {
            echo "## Couverture ADS-B / ADS-L : ${LAT}, ${LON} (${MODE})"
            echo
            echo '```'
            cat out/resume.txt
            echo '```'
            echo
            echo "Le fichier KML est disponible dans les **Artifacts** de cette exécution (ouvrir avec Google Earth ou QGIS)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le KML
        uses: actions/upload-artifact@v4
        with:
          name: couverture-kml
          path: out/*.kml
          retention-days: 30
