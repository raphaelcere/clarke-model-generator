[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adsb-coverage"
version = "0.1.0"
description = "Theoretical reception coverage (line of sight, terrain, effective Earth radius) of a fixed ADS-B / ADS-L receiver, KML output"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "requests>=2.28"]

[project.optional-dependencies]
geotiff = ["rasterio>=1.3"]
fading = ["scipy>=1.8"]  # Rice statistics (--fading rice)
dev = ["pytest>=7", "rasterio>=1.3", "scipy>=1.8"]

[project.scripts]
adsb-coverage = "adsb_coverage.core:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
