[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adsb-coverage"
version = "0.1.0"
description = "Couverture de réception théorique (LOS, relief, rayon terrestre effectif) d'un récepteur fixe ADS-B / ADS-L, sortie KML"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "requests>=2.28"]

[project.optional-dependencies]
geotiff = ["rasterio>=1.3"]
dev = ["pytest>=7", "rasterio>=1.3"]

[project.scripts]
adsb-coverage = "adsb_coverage.core:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
